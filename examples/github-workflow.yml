# .github/workflows/site-audit.yml — audit a deployed URL on every push to main
# and fail the job when anything is "Fix now". The HTML report is kept as an artifact.
name: Site audit
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit
        id: audit
        uses: BYDTechSolutions/site-audit@v0
        with:
          url: https://staging.example.com
          psi-key: ${{ secrets.PSI_API_KEY }}
          html-file: site-audit.html
          # desktop: true
          # fail-on: should-fix   # stricter; none never fails
      - name: Keep the HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-audit-report
          path: site-audit.html
      - name: Google's mobile performance score
        if: always()
        env:
          PERFORMANCE: ${{ fromJSON(steps.audit.outputs.scores || '{}').mobile.performance }}
        run: echo "Google Lighthouse performance, mobile, this run - $PERFORMANCE"
